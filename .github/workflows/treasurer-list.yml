# Loads new county tax foreclosure lists automatically (Wayne Treasurer list, Macomb December notice).
# Daily: find each county's newest list; if it is new (or its PDF changed), parse it, validate it, and commit
# data/treasurer/<county>_forfeited_<year>.csv to main. The push deploys to leads.4-return.com and the next
# scheduled run imports it (resumable, ~20k rows per run). Counties run independently: one failing doesn't
# block the other. A failed scheduled run commits nothing for that county and opens an issue (see bottom).
name: Treasurer list

on:
  schedule:
    - cron: "17 12 * * *" # daily, ~7-8 a.m. Detroit
  workflow_dispatch:
    inputs:
      county:
        description: "Which county"
        type: choice
        options: [all, wayne, macomb]
        default: all
      year:
        description: "Wayne list year (blank = newest on the page)"
        required: false
      pdf_url:
        description: "PDF URL (only if the page link can't be found; Wayne needs year too)"
        required: false
      dry_run:
        description: "Parse and validate only, commit nothing"
        type: boolean
        default: false
      force:
        description: "Re-parse even if the PDF is unchanged"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: treasurer-list
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Wayne - fetch, parse and validate
        id: wayne
        if: inputs.county == '' || inputs.county == 'all' || inputs.county == 'wayne'
        continue-on-error: true
        env:
          YEAR: ${{ inputs.year }}
          PDF_URL: ${{ inputs.pdf_url }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          set -o pipefail
          args=()
          [ -n "$YEAR" ] && args+=(--year "$YEAR")
          [ -n "$PDF_URL" ] && args+=(--pdf-url "$PDF_URL")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$FORCE" = "true" ] && args+=(--force)
          python3 tools/fetch_treasurer_list.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Macomb - fetch, parse and validate
        id: macomb
        if: inputs.county == '' || inputs.county == 'all' || inputs.county == 'macomb'
        continue-on-error: true
        env:
          PDF_URL: ${{ inputs.county == 'macomb' && inputs.pdf_url || '' }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          set -o pipefail
          args=()
          [ -n "$PDF_URL" ] && args+=(--pdf-url "$PDF_URL")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$FORCE" = "true" ] && args+=(--force)
          python3 tools/fetch_macomb_notice.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit new lists
        if: steps.wayne.outputs.changed == 'true' || steps.macomb.outputs.changed == 'true'
        env:
          MSG: >-
            ${{ steps.wayne.outputs.changed == 'true' && format('Wayne {0}: {1} parcels. ', steps.wayne.outputs.year, steps.wayne.outputs.rows) || '' }}${{ steps.macomb.outputs.changed == 'true' && format('Macomb {0}: {1} parcels.', steps.macomb.outputs.year, steps.macomb.outputs.rows) || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/treasurer/
          if git diff --cached --quiet; then echo "No change to commit"; exit 0; fi
          git commit -m "Treasurer lists (automatic): $MSG"
          git push origin HEAD:main

      - name: Fail if a county failed
        if: steps.wayne.outcome == 'failure' || steps.macomb.outcome == 'failure'
        env:
          WAYNE: ${{ steps.wayne.outcome }}
          MACOMB: ${{ steps.macomb.outcome }}
        run: |
          echo "Wayne: $WAYNE, Macomb: $MACOMB"
          exit 1

      # Actions emails are off for the repo owner, so a failure of this job opens an issue instead
      # (issues still email). One open issue at a time; it is closed by the next successful run.
      - name: Open an issue on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WAYNE: ${{ steps.wayne.outcome }}
          MACOMB: ${{ steps.macomb.outcome }}
        run: |
          title="Treasurer list import failed"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          body="The daily Treasurer list job failed on $(date -u +%F) (Wayne: $WAYNE, Macomb: $MACOMB). Run log: $RUN_URL
          Likely causes: the county page or PDF layout changed, or the county site blocked the runner.
          See docs/deploy.md (New Treasurer list) for the manual fallback."
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --assignee "${{ github.repository_owner }}"
          fi

      - name: Close the failure issue after a successful run
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search '"Treasurer list import failed" in:title' --json number -q '.[].number'); do
            gh issue close "$n" --comment "Fixed: the daily run on $(date -u +%F) succeeded."
          done
